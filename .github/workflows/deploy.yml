name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# ההרשאות המינימליות שצריך כדי לפרסם ל-Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # שום דבר לא מתפרסם אם הבדיקות נופלות
      - run: npm test
      - run: npm run check

      - name: Build
        env:
          # GitHub Pages מגיש את האתר תחת /<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # SPA fallback — כל נתיב שלא נמצא מחזיר את האתר
      - run: cp dist-web/index.html dist-web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
